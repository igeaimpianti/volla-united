<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#bc0925">
<title>Volla United Academy — Sito in aggiornamento</title>
<meta name="description" content="Volla United Academy. Il nostro sito è in aggiornamento. Torniamo presto online.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100svh;background:#bc0925;background:radial-gradient(ellipse at 50% 20%,#df1737 0%,#bc0925 55%,#88091e 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:32px 20px;text-align:center}
main{width:100%;max-width:760px;padding:48px 16px}
.logo{display:block;width:clamp(160px,32vw,250px);height:auto;max-height:300px;object-fit:contain;margin:0 auto 36px;filter:drop-shadow(0 18px 28px #64051366)}
.brand{font-size:clamp(13px,2.6vw,18px);font-weight:700;letter-spacing:.22em;margin:0 0 25px}
h1{font-size:clamp(32px,7vw,64px);line-height:1.08;letter-spacing:-.035em;margin:0;font-weight:900}
.line{width:52px;height:4px;background:#fff;border-radius:3px;margin:30px auto}
.message{font-size:clamp(16px,3vw,20px);line-height:1.6;margin:0;color:#ffe5ea}
footer{margin-top:64px;font-size:11px;letter-spacing:.12em;color:#ffd3dc}
</style>
</head>
<body>
<main>
<img class="logo" src="https://app.vollaunitedacademy.com/logo.png" alt="Logo Volla United Academy" width="250" height="250">
<p class="brand">VOLLA UNITED ACADEMY</p>
<h1>SITO IN<br>AGGIORNAMENTO</h1>

<footer>VOLLAUNITEDACADEMY.COM</footer>
</main>
</body>
